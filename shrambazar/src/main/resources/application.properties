spring.application.name=shrambazar
server.port=${PORT:8080}


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shrambazar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.data.jpa.repositories.bootstrap-mode=lazy
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

app.storage.verification-dir=${VERIFICATION_STORAGE_DIR:./private-storage/verification}

app.storage.profile-picture-dir=${PROFILE_PICTURE_STORAGE_DIR:./uploads/profile-pictures}

app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${RESEND_FROM_EMAIL:}

# Replaces imported simulated listings at startup; provider-created jobs remain in their own table.
app.dataset.import-file=${SHOWCASE_JOBS_JSON:data/jobs.json}
app.dataset.import-enabled=${APP_DATASET_IMPORT_ENABLED:true}
